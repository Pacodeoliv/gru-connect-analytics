x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:-airflow}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    GRU_BASE_DIR: /opt/airflow
    AIRFLOW_UID: ${AIRFLOW_UID:-50000}
  env_file:
    - .env
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dbt_gru:/opt/airflow/dbt_gru
    - ./spark_jobs:/opt/airflow/spark_jobs
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
    - ./warehouse:/opt/airflow/warehouse
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  user: "${AIRFLOW_UID:-50000}:0"

services:
  # ─── Banco de dados para metastore do Airflow ─────────────────────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "airflow" ]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ─── Airflow: inicialização do banco ──────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - /opt/airflow/scripts/docker-init.sh
    restart: on-failure

  # ─── Airflow Webserver (UI em localhost:8080) ─────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ─── Airflow Scheduler ────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: [ "CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$${HOSTNAME}" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ─── Apache Spark Master ──────────────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.0
    user: root
    entrypoint:
      - /bin/bash
      - -c
      - |
        ICEBERG_JAR="/opt/spark/jars/iceberg-spark-runtime-3.5_2.12-1.5.0.jar"
        if [ ! -f "$$ICEBERG_JAR" ]; then
          echo "Baixando biblioteca Iceberg..."
          curl -s https://repo1.maven.org/maven2/org/apache/iceberg/iceberg-spark-runtime-3.5_2.12/1.5.0/iceberg-spark-runtime-3.5_2.12-1.5.0.jar \
               -o "$$ICEBERG_JAR"
        else
          echo "Biblioteca Iceberg ja presente, pulando download."
        fi

        /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master &

        sleep 10

        /opt/spark/sbin/start-thriftserver.sh \
          --master spark://spark-master:7077 \
          --jars "$$ICEBERG_JAR" \
          --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions \
          --conf spark.sql.catalog.spark_catalog=org.apache.iceberg.spark.SparkSessionCatalog \
          --conf spark.sql.catalog.spark_catalog.type=hadoop \
          --conf spark.sql.catalog.spark_catalog.warehouse=/opt/airflow/warehouse \
          --conf spark.sql.catalog.local=org.apache.iceberg.spark.SparkCatalog \
          --conf spark.sql.catalog.local.type=hadoop \
          --conf spark.sql.catalog.local.warehouse=/opt/airflow/warehouse \
          --conf spark.hive.server2.thrift.port=10000 \
          --conf spark.hive.server2.thrift.bind.host=0.0.0.0

        tail -f /opt/spark/logs/*
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8082"
    ports:
      - "7077:7077"
      - "8082:8082"
      - "10000:10000"
    volumes:
      - ./data:/opt/spark/data
      - ./warehouse:/opt/airflow/warehouse
      - spark-jars:/opt/spark/jars # volume compartilhado com workers
    restart: unless-stopped

  # ─── Apache Spark Worker ──────────────────────────────────────────────────
  spark-worker:
    image: apache/spark:3.5.0
    user: root
    entrypoint: [ "/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077" ]
    environment:
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: "2"
    volumes:
      - ./data:/opt/spark/data
      - ./warehouse:/opt/airflow/warehouse # path alinhado ao master
      - spark-jars:/opt/spark/jars # mesmo JAR Iceberg que o driver usa
    depends_on:
      - spark-master
    restart: unless-stopped

  # ─── Streamlit Dashboard (localhost:8501) ────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  postgres-db:
  airflow-logs:
  spark-jars: # JARs compartilhados entre master (driver) e workers (executors)
