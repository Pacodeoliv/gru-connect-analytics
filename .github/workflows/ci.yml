name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - run: pip install "ruff>=0.1.0"

      - run: ruff check spark_jobs/ dags/

  dbt-validate:
    name: dbt validate
    runs-on: ubuntu-latest
    env:
      GRU_BASE_DIR: /tmp/gru-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dbt-duckdb
        # Uses duckdb adapter (no Java/Spark needed) to validate SQL and Jinja syntax.
        # The production adapter (dbt-spark) is used locally; CI only needs parse+compile.
        run: pip install "dbt-duckdb>=1.8.0,<2.0.0"

      - name: dbt parse
        working-directory: dbt_gru
        run: dbt parse --profiles-dir . --profile gru_connect --target ci

      - name: dbt compile
        working-directory: dbt_gru
        run: dbt compile --profiles-dir . --profile gru_connect --target ci

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - run: pip install pytest

      - name: Run tests
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests/)" ]; then
            pytest tests/ -v --tb=short
          else
            echo "No tests found, skipping."
          fi
