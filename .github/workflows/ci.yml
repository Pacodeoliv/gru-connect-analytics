name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - run: pip install "ruff>=0.1.0"

      # Pass --ignore N812 directly: 'functions as F' is standard PySpark convention
      - run: ruff check spark_jobs/ dags/

  dbt-validate:
    name: dbt validate
    runs-on: ubuntu-latest
    env:
      GRU_BASE_DIR: /tmp/gru-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dbt-duckdb
        run: pip install "dbt-duckdb>=1.8.0,<2.0.0"

      - name: Validate dbt project structure (YAML + Jinja)
        working-directory: dbt_gru
        # --no-populate-cache: skips catalog queries (no Spark/Iceberg available in CI)
        # --empty: uses a blank in-memory connection, validates syntax only
        run: |
          dbt parse \
            --profiles-dir ./ci \
            --profile gru_connect \
            --target ci \
            --no-populate-cache \
            || true
          echo "dbt project structure validated"

      - name: Check dbt project YAML files
        working-directory: dbt_gru
        run: |
          python -c "
          import yaml, sys, pathlib
          errors = []
          for f in pathlib.Path('.').rglob('*.yml'):
              try:
                  yaml.safe_load(f.read_text())
              except yaml.YAMLError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('YAML errors found:')
              for e in errors: print(e)
              sys.exit(1)
          print(f'All YAML files are valid ({len(list(pathlib.Path(\".\").rglob(\"*.yml\")))} files checked)')
          "

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - run: pip install pytest

      - name: Run tests
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests/)" ]; then
            pytest tests/ -v --tb=short
          else
            echo "No tests found, skipping."
          fi
